name: Build ContactPanda Basic package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tested_wordpress:
        description: Highest WordPress version verified for this release
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate source
        run: ./tools/check.sh
      - name: Build installable ZIP files
        env:
          CONTACTPANDA_TESTED_WP: ${{ inputs.tested_wordpress }}
        run: ./tools/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: contactpanda-basic-package
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --latest
          fi

